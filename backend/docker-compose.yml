services:
  db:
    image: postgres:15
    container_name: playtracker-db
    restart: always
    environment:
      POSTGRES_USER: playtracker
      POSTGRES_PASSWORD: playtracker
      POSTGRES_DB: playtracker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: playtracker-backend
    restart: always
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql+asyncpg://playtracker:playtracker@db:5432/playtracker
    ports:
      - "8000:8000"
    command: >
      uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./:/app

volumes:
  pgdata: