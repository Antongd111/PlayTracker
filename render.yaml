services:
   -
      type: web
      name: playtracker-backend
      runtime: docker
      region: frankfurt
      plan: free

      dockerfilePath: backend/Dockerfile
      dockerContext: backend

      dockerCommand: sh -c "uvicorn main:app --host 0.0.0.0 --port ${PORT}"

      healthCheckPath: /health

      envVars:
         -
            key: DATABASE_URL
            fromDatabase:
               name: mi-db
               property: connectionString
         -
            key: SECRET_KEY
            sync: false
         -
            key: RAWG_API_KEY
            sync: false
         -
           key: ACCESS_TOKEN_EXPIRE_MINUTES
           value: "60"
         -
           key: ALGORITHM
           value: HS256

databases:
   -
      name: playtracker-db
      region: frankfurt
      plan: free
