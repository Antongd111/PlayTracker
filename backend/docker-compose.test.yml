services:
  db_test:
    image: postgres:15
    container_name: playtracker-db-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: playtracker
      POSTGRES_PASSWORD: playtracker
      POSTGRES_DB: playtracker_test
    ports:
      - "5433:5432"
    tmpfs: /var/lib/postgresql/data # Utilizar un sistema de archivos temporal para los tests

  tests:
    build: .
    container_name: playtracker-tests
    env_file: .env.test
    depends_on:
      - db_test
    volumes:
      - ./:/app
    command: >
      sh -c "pytest --maxfail=1 --disable-warnings -v"
      