services:
  db_test:
    image: postgres:15
    container_name: playtracker-db-test
    env_file: .env.test
    restart: unless-stopped
    environment:
      POSTGRES_USER: playtracker
      POSTGRES_PASSWORD: playtracker
      POSTGRES_DB: playtracker_test
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"
    tmpfs: 
      - /var/lib/postgresql/data
    # AÑADIR ESTO: Verificación de salud
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U playtracker -d playtracker_test"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  tests:
    build: .
    container_name: playtracker-tests
    env_file: .env.test
    depends_on:
      db_test:
        condition: service_healthy  # ESPERAR A QUE EL HEALTHCHECK PASE
    volumes:
      - ./:/app
    command: >
      sh -c "pytest --maxfail=1 --disable-warnings -v"